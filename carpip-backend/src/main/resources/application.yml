server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 60

spring:
  application:
    name: carpip-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/carpip}
    username: ${DB_USER:carpip_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      initialization-fail-timeout: 120000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 1000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 8000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 20000
    listener:
      ack-mode: record
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
    schema:
      locations: classpath:graphql/
  task:
    scheduling:
      pool:
        size: 8
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

carpip:
  jwt-secret: ${JWT_SECRET:}
  enc-key: ${CARPIP_ENC_KEY:}
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
  intelligence-url: ${INTELLIGENCE_URL:http://carpip-intelligence:5000}
  admin-email: ${CARPIP_ADMIN_EMAIL:admin@carpip.local}
  admin-password: ${CARPIP_ADMIN_PASSWORD:}
  demo-mode: ${DEMO_MODE:true}
  webhook-tolerance-s: ${WEBHOOK_TOLERANCE_S:300}
  erp-sync-interval-ms: ${ERP_SYNC_INTERVAL_MS:60000}
  auto-receive: ${AUTO_RECEIVE_ON_DELIVERY:true}
  reject-cooldown-min: ${REJECT_COOLDOWN_MIN:30}
  quote-ttl-h: ${NEGOTIATION_QUOTE_TTL_H:24}
  public-webhook-base: ${PUBLIC_WEBHOOK_BASE:http://carpip-backend:8080}

demo:
  pos-url: ${POS_URL:http://pos-backend:4000}
  pos-admin-token: ${POS_ADMIN_TOKEN:}
  erp-url: ${ERP_URL:http://erp-backend:8000}
  erp-admin-token: ${ERP_ADMIN_TOKEN:}

logging:
  level:
    root: INFO
    com.carpip: INFO
    org.apache.kafka: WARN
