server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;   # re-resolve at request time: nginx must start even if the backend is not up yet

  location /api/ {
    set $up http://carpip-backend:8080;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;            # Server-Sent Events
    proxy_read_timeout 3600s;
  }
  location /graphql { set $up http://carpip-backend:8080; proxy_pass $up; proxy_set_header Host $host; }
  location /graphiql { set $up http://carpip-backend:8080; proxy_pass $up; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
