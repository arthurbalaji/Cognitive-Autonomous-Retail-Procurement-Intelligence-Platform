spring:
  application:
    name: pos-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_db?options=-c%20TimeZone=Asia/Kolkata}
    username: ${DB_USERNAME:pos_user}
    password: ${DB_PASSWORD:pos_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    generate-ddl: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}