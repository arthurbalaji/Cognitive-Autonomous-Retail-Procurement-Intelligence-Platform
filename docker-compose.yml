version: '3.8'

services:
  # ============================================================
  #  INFRASTRUCTURE
  # ============================================================

  # Shared PostgreSQL — creates carpipdb, pos_db, erp_db on first run
  postgres:
    image: postgres:15-alpine
    container_name: carpip-postgres
    environment:
      POSTGRES_DB: carpipdb
      POSTGRES_USER: carpip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpip_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpip"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carpip-network

  # Redis Cache (for CARPIP)
  redis:
    image: redis:7-alpine
    container_name: carpip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carpip-network

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: carpip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - carpip-network

  # Apache Kafka (for CARPIP event streaming)
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: carpip-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - carpip-network

  # ============================================================
  #  CARPIP PLATFORM (Central AI Engine)
  # ============================================================

  carpip-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carpip-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/carpipdb
      DATABASE_USER: carpip
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-carpip_secure_password}
      DATABASE_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-carpip-production-secret-key-must-be-at-least-256-bits-long}
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost,http://carpip-frontend:80
      AI_SERVICE_URL: http://carpip-ai-service:5000
      # Integration URLs — point to POS and ERP backends within the Docker network
      POS_API_URL: http://pos-backend:8081
      ERP_API_URL: http://erp-backend:8082
    networks:
      - carpip-network

  carpip-ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: carpip-ai-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./ai-service/credentials:/app/credentials:ro
    environment:
      DATABASE_URL: postgresql://carpip:${POSTGRES_PASSWORD:-carpip_secure_password}@postgres:5432/carpipdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/service-account.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-gen-lang-client-0550374026}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-flask-dev-secret}
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost,http://carpip-frontend:80
    networks:
      - carpip-network

  carpip-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carpip-frontend
    depends_on:
      - carpip-backend
      - carpip-ai-service
    ports:
      - "80:80"
    networks:
      - carpip-network

  # ============================================================
  #  POS APPLICATION (Retailer Point-of-Sale)
  # ============================================================

  pos-backend:
    build:
      context: ./pos-application/backend
      dockerfile: Dockerfile
    container_name: pos-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pos_db
      DB_USERNAME: pos_user
      DB_PASSWORD: pos_password
      SERVER_PORT: 8081
    networks:
      - carpip-network

  pos-frontend:
    build:
      context: ./pos-application/frontend
      dockerfile: Dockerfile
    container_name: pos-frontend
    depends_on:
      - pos-backend
    ports:
      - "3001:80"
    networks:
      - carpip-network

  # ============================================================
  #  ERP APPLICATION (Wholesaler Enterprise Resource Planning)
  # ============================================================

  erp-backend:
    build:
      context: ./erp-application/backend
      dockerfile: Dockerfile
    container_name: erp-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/erp_db
      DB_USERNAME: erp_user
      DB_PASSWORD: erp_password
      SERVER_PORT: 8082
    networks:
      - carpip-network

  erp-frontend:
    build:
      context: ./erp-application/frontend
      dockerfile: Dockerfile
    container_name: erp-frontend
    depends_on:
      - erp-backend
    ports:
      - "3002:80"
    networks:
      - carpip-network

# ============================================================
#  VOLUMES & NETWORKS
# ============================================================

volumes:
  postgres_data:
    name: carpip-postgres-data
  redis_data:
    name: carpip-redis-data

networks:
  carpip-network:
    driver: bridge
    name: carpip-network
